<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Doctor</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div class="navbar">
    <div class="brand">🏥 Patient Management System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/doctors}">Doctors</a>
        <a th:href="@{/appointments}">Appointments</a>
    </div>
</div>

<div class="container">
    <h1>Register New Doctor</h1>

    <form th:action="@{/doctors/save}" th:object="${doctor}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" />

        <label>Specialization</label>
        <input type="text" th:field="*{specialization}" />

        <label>Phone Number</label>
        <input type="text" th:field="*{phoneNumber}" />

        <label>Email</label>
        <input type="text" th:field="*{email}" />

        <button type="submit">Register Doctor</button>
    </form>

    <br>
    <a th:href="@{/doctors}">Back to Doctors List</a>
</div>

</body>
</html>
