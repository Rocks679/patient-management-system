<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Patient List</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div class="navbar">
    <div class="brand">🏥 Patient Management System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/doctors}">Doctors</a>
        <a th:href="@{/appointments}">Appointments</a>
    </div>
</div>

<div class="container">
    <h1>All Patients</h1>
    <a class="btn-link" th:href="@{/patients/new}">+ Register New Patient</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Action</th>
        </tr>
        <tr th:each="patient : ${patients}">
            <td th:text="${patient.id}"></td>
            <td th:text="${patient.name}"></td>
            <td th:text="${patient.age}"></td>
            <td th:text="${patient.gender}"></td>
            <td>
                <a th:href="@{/patients/delete/{id}(id=${patient.id})}">Delete</a>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
