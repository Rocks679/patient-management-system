<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Register Patient</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div class="navbar">
    <div class="brand">🏥 Patient Management System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/doctors}">Doctors</a>
        <a th:href="@{/appointments}">Appointments</a>
    </div>
</div>

<div class="container">
    <h1>Register New Patient</h1>

    <form th:action="@{/patients/save}" th:object="${patient}" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" />

        <label for="age">Age</label>
        <input type="number" id="age" th:field="*{age}" />

        <label for="gender">Gender</label>
        <input type="text" id="gender" th:field="*{gender}" />

        <label for="phoneNumber">Phone Number</label>
        <input type="text" id="phoneNumber" th:field="*{phoneNumber}" />

        <label for="address">Address</label>
        <input type="text" id="address" th:field="*{address}" />

        <label for="medicalHistory">Medical History</label>
        <textarea id="medicalHistory" th:field="*{medicalHistory}"></textarea>

        <button type="submit">Register Patient</button>
    </form>

    <br>
    <a th:href="@{/patients}">Back to Patient List</a>
</div>

</body>
</html>
