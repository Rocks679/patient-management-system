<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Patient</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div class="navbar">
    <div class="brand">🏥 Patient Management System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/doctors}">Doctors</a>
        <a th:href="@{/appointments}">Appointments</a>
    </div>
</div>

<div class="container">
    <h1>Register New Patient</h1>

    <form th:action="@{/patients/save}" th:object="${patient}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" />

        <label>Age</label>
        <input type="number" th:field="*{age}" />

        <label>Gender</label>
        <input type="text" th:field="*{gender}" />

        <label>Phone Number</label>
        <input type="text" th:field="*{phoneNumber}" />

        <label>Address</label>
        <input type="text" th:field="*{address}" />

        <label>Medical History</label>
        <textarea th:field="*{medicalHistory}"></textarea>

        <button type="submit">Register Patient</button>
    </form>

    <br>
    <a th:href="@{/patients}">Back to Patient List</a>
</div>

</body>
</html>
